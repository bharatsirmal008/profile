<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="120" x2="904" y2="904" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(512 480) rotate(90) scale(430)">
      <stop stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="72" y="72" width="880" height="880" rx="230" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="72" y="72" width="880" height="880" rx="230" fill="url(#glow)"/>
  <rect x="88" y="88" width="848" height="848" rx="214" stroke="white" stroke-opacity="0.18" stroke-width="8"/>

  <!-- Graduation cap -->
  <path d="M235 413L512 288L789 413L512 538L235 413Z"
        fill="white" filter="url(#softGlow)"/>
  <path d="M349 475V602C349 653 422 694 512 694C602 694 675 653 675 602V475L512 549L349 475Z"
        fill="white" fill-opacity="0.92"/>

  <!-- Tassel -->
  <path d="M789 413V563" stroke="white" stroke-width="24" stroke-linecap="round"/>
  <circle cx="789" cy="594" r="24" fill="white"/>
</svg>
