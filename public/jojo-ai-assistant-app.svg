<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="120" x2="904" y2="904" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16D9FF"/>
      <stop offset="0.45" stop-color="#6C5CFF"/>
      <stop offset="1" stop-color="#FF4FD8"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(512 500) rotate(90) scale(420)">
      <stop stop-color="white" stop-opacity="0.20"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="72" y="72" width="880" height="880" rx="230" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="72" y="72" width="880" height="880" rx="230" fill="url(#glow)"/>
  <rect x="88" y="88" width="848" height="848" rx="214" stroke="white" stroke-opacity="0.18" stroke-width="8"/>

  <!-- AI orbit mark -->
  <g transform="translate(512 510)" stroke="white" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <ellipse rx="250" ry="106" transform="rotate(0)" fill="none"/>
    <ellipse rx="250" ry="106" transform="rotate(60)" fill="none"/>
    <ellipse rx="250" ry="106" transform="rotate(120)" fill="none"/>
  </g>

  <!-- Central AI core -->
  <circle cx="512" cy="510" r="104" fill="white" fill-opacity="0.96" filter="url(#softGlow)"/>
  <circle cx="512" cy="510" r="58" fill="url(#bg)"/>

  <!-- Neural nodes -->
  <circle cx="758" cy="510" r="34" fill="white"/>
  <circle cx="635" cy="297" r="34" fill="white"/>
  <circle cx="389" cy="297" r="34" fill="white"/>
  <circle cx="266" cy="510" r="34" fill="white"/>
  <circle cx="389" cy="723" r="34" fill="white"/>
  <circle cx="635" cy="723" r="34" fill="white"/>

  <!-- Small sparkle details -->
  <circle cx="278" cy="251" r="12" fill="white" fill-opacity="0.72"/>
  <circle cx="786" cy="284" r="10" fill="white" fill-opacity="0.60"/>
  <circle cx="804" cy="727" r="14" fill="white" fill-opacity="0.65"/>
</svg>
