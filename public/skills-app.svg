<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="120" x2="904" y2="904" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4"/>
      <stop offset="0.48" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(512 500) rotate(90) scale(430)">
      <stop stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="72" y="72" width="880" height="880" rx="230" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="72" y="72" width="880" height="880" rx="230" fill="url(#glow)"/>
  <rect x="88" y="88" width="848" height="848" rx="214" stroke="white" stroke-opacity="0.18" stroke-width="8"/>

  <!-- Gear -->
  <g fill="white" filter="url(#softGlow)">
    <circle cx="512" cy="512" r="168"/>
    <rect x="482" y="245" width="60" height="110" rx="24"/>
    <rect x="482" y="669" width="60" height="110" rx="24"/>
    <rect x="669" y="482" width="110" height="60" rx="24"/>
    <rect x="245" y="482" width="110" height="60" rx="24"/>
    <rect x="635" y="300" width="60" height="110" rx="24" transform="rotate(45 635 300)"/>
    <rect x="329" y="606" width="60" height="110" rx="24" transform="rotate(45 329 606)"/>
    <rect x="606" y="695" width="60" height="110" rx="24" transform="rotate(135 606 695)"/>
    <rect x="300" y="389" width="60" height="110" rx="24" transform="rotate(135 300 389)"/>
  </g>

  <!-- Code symbol in gear -->
  <circle cx="512" cy="512" r="104" fill="url(#bg)"/>
  <path d="M478 456L424 512L478 568"
        stroke="white" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M546 456L600 512L546 568"
        stroke="white" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M532 435L492 589"
        stroke="white" stroke-width="22" stroke-linecap="round"/>
</svg>
